[project]
name = "mssql-mcp-server"
version = "0.1.0"
description = "An MCP server for Microsoft SQL Server"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "pyodbc>=5.1.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-json-logger>=2.0.7",
    "azure-identity>=1.17.0",
    "msal>=1.30.0",
    "msal-extensions>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
mssql-mcp-server = "mssql_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mssql_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = [
    "pyodbc",
    "pythonjsonlogger.*",
    "msal_extensions",
    "msal_extensions.*",
    "msal",
    "msal.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=mssql_mcp --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["tests"]
